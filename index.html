<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&family=Caveat:wght@400;600&display=swap">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#b0c0a8;display:flex;justify-content:center;padding:10px;min-height:100vh}
#root{width:360px}
.shell{width:360px;height:620px;border-radius:26px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;position:relative;font-family:'DM Sans',sans-serif;
  --bg:#fffbf5;--bg2:#f5ece0;--text:#2a1c0e;--t2:#7a6848;--t3:#b0a088;
  --bdr:#e0ceb8;--bdr2:#d0bea8;--gbg:#e8f0d8;--gt:#2a4810;--gbdr:#b0d088;
  --sos:#fceee6;--sost:#8a3010;--sosh:#5a1e08;--sosbdr:#e8b090;
  --acc:#c8703a;--grn:#3a8a4a;
  background:var(--bg)}
.shell.dark{--bg:#1a1208;--bg2:#241a0c;--text:#f0e0c0;--t2:#c8a878;--t3:#8a7050;--bdr:#3a2818;--bdr2:#2e2010;--gbg:#1e2a10;--gt:#80d860;--gbdr:#3a5820;--sos:#3a1808;--sost:#f09060;--sosh:#ffcca8;--sosbdr:#602818}
.shell.dark .bk,.shell.dark .bk *,.shell.dark .tbt{color:var(--t2)!important}
.shell.dark .stab:not(.on){color:var(--text)!important;background:rgba(255,255,255,.07)!important;border-color:var(--bdr)!important}
.shell.dark .stab.on{color:var(--grn)!important;background:var(--gbg)!important}
.shell.dark .ni:not(.on),.shell.dark .ni:not(.on) i{color:var(--t2)!important}
.shell.dark .ni.on,.shell.dark .ni.on i{color:var(--grn)!important}
.shell.dark .tb,.shell.dark .nav{background:var(--bg)!important;border-color:var(--bdr)!important}
.shell.dark .btn:not(:disabled){background:var(--grn)!important;color:#e8f8e8!important}
.shell.dark .btn:disabled{background:rgba(58,138,74,.2)!important;color:rgba(58,138,74,.4)!important}
.shell.dark .mbox{background:var(--bg)!important}
.sup-n{background:var(--acc)!important;border-radius:50%;width:52px;height:52px;flex:0 0 52px;align-self:center;margin:0 6px;padding:0;box-shadow:0 3px 14px rgba(200,112,58,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500}
.sup-n,.sup-n *{color:#fff!important}
.serif{font-family:'DM Serif Display',serif}
.scroll{flex:1;overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.gb{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative}
.tb{display:flex;align-items:center;padding:12px 14px 8px;min-height:48px;flex-shrink:0;background:var(--bg);gap:4px;position:relative;border-bottom:.5px solid var(--bdr)}
.tbt{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:500;color:var(--t2);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
.bk{background:none;border:none;cursor:pointer;color:var(--t2);font-size:13px;display:flex;align-items:center;gap:3px;z-index:1;flex-shrink:0;font-family:'DM Sans',sans-serif}
.dm{background:none;border:none;cursor:pointer;font-size:16px;padding:2px;flex-shrink:0;line-height:1;margin-left:auto}
.inp{width:100%;border:1.5px solid var(--bdr2);border-radius:12px;padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg2);outline:none}
.inp:focus{border-color:var(--grn)}
.ta{width:100%;border:1.5px solid var(--bdr2);border-radius:12px;padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg2);resize:none;outline:none}
.ta:focus{border-color:var(--grn)}
.inp::placeholder,.ta::placeholder{color:var(--t3);font-style:italic}
.btn{width:100%;padding:13px;background:var(--grn)!important;color:#e8f8e8!important;border:none;border-radius:13px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer}
.btn:disabled{background:rgba(58,138,74,.2)!important;color:rgba(58,138,74,.45)!important;cursor:not-allowed}
.btng{width:100%;padding:13px;background:var(--bg2);color:var(--text);border:1.5px solid var(--bdr);border-radius:13px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer}
.mb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;border:2px solid var(--bdr);border-radius:14px;background:var(--bg);cursor:pointer;position:relative;transition:all .15s}
.mb.sel{border-color:var(--gbdr);background:var(--gbg)}
.stat{flex:1;background:var(--bg2);border-radius:11px;padding:9px;text-align:center}
.nav{flex-shrink:0;height:64px;background:var(--bg);border-top:.5px solid var(--bdr);display:flex;align-items:center;z-index:50}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;color:var(--t3);cursor:pointer;padding:5px 0 4px;position:relative;min-width:0}
.ni.on{color:var(--grn)}
.ni i{font-size:20px}
.pip{position:absolute;top:1px;left:50%;transform:translateX(-50%);width:5px;height:5px;background:var(--grn);border-radius:50%}
.pip.d{border-radius:1px;transform:translateX(-50%) rotate(45deg)}
.pip.l{width:14px;height:3px;border-radius:2px;top:2px}
.pip.tr{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid var(--grn);background:none;border-radius:0;top:0}
.bnr{display:flex;align-items:center;gap:8px;background:var(--gbg);border:1.5px solid var(--gbdr);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:var(--gt)}
.jent{background:var(--bg2);border-radius:11px;padding:11px 13px;margin-bottom:8px;border:.5px solid var(--bdr)}
.stab{padding:7px 14px;border-radius:20px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--bdr);background:var(--bg);color:var(--t2)}
.stab.on{border-color:var(--grn);background:var(--gbg);color:var(--grn)}
.trick{border:1.5px solid var(--bdr);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.trick.sel{border-color:var(--grn);background:var(--gbg)}
.trick.full{opacity:.35;cursor:not-allowed}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:99}
.mbox{background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px 30px;width:100%;max-height:85%;overflow-y:auto}
.pfield{padding:9px 0;border-bottom:.5px solid var(--bdr)}
.pfield .pl{font-size:11px;font-weight:500;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.pfield .pv{font-size:15px;color:var(--text);font-weight:500}
.mic{width:38px;height:38px;border-radius:50%;background:var(--sos);border:1.5px solid var(--sosbdr);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
canvas{display:block;touch-action:none}
#amb{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0;transition:opacity .7s}
#amb.on{opacity:1}
.mui{position:relative;z-index:1}
.ob{flex:1;overflow-y:auto;padding:32px 24px;display:flex;flex-direction:column;justify-content:center}
.gtile{border-radius:14px;padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;min-height:110px;justify-content:center;transition:transform .12s}
.gtile:active{transform:scale(.96)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes jiggle{0%{transform:scale(1)}25%{transform:scale(1.5) rotate(-10deg)}50%{transform:scale(1.3) rotate(8deg)}75%{transform:scale(1.4) rotate(-5deg)}100%{transform:scale(1)}}
@keyframes cfall{0%{transform:translateY(-50px) rotate(0deg);opacity:1}100%{transform:translateY(750px) rotate(720deg);opacity:0}}
@keyframes cpop{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.25) rotate(5deg)}100%{transform:scale(1)}}
@keyframes cfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── Mobile: fill full viewport, no phone frame ── */
@media(max-width:520px){
  body{background:#fffbf5;padding:0;align-items:flex-start}
  body.dm-dark{background:#1a1208}
  #root{width:100vw}
  .shell{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  .ob{padding:40px 24px 32px}
}
@keyframes mascot-life{0%,100%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.04) rotate(-1deg)}50%{transform:scale(1.08) rotate(0deg)}75%{transform:scale(1.04) rotate(1deg)}91%{transform:scale(1) rotate(-2deg)}95%{transform:scale(1) rotate(2deg)}}
.cr-mascot{animation:mascot-life 6s ease-in-out infinite;display:inline-block}
.cr-obj{background:none;border:none;padding:0;cursor:pointer;transition:transform .2s ease;-webkit-tap-highlight-color:transparent}
.cr-obj:hover{filter:brightness(1.03)}
.cr-obj:active{transform:scale(.95)!important}
.cr-obj:focus-visible,#cr-companion:focus-visible{outline:2px dashed currentColor;outline-offset:4px}
.cr-clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cr-room::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){.cr-mascot,.aff-sway{animation:none!important}}
@keyframes polshadow{0%,100%{box-shadow:3px 4px 12px rgba(0,0,0,.18)}50%{box-shadow:5px 6px 18px rgba(0,0,0,.25)}}
</style>

/* ── Ambient mood animations (auto-stop after 10s) ── */
function stopAmb(){if(ambRAF){cancelAnimationFrame(ambRAF);ambRAF=null;}ambObj={};var c=Q('amb');if(c){c.classList.remove('on');var ctx=c.getContext('2d');if(ctx)ctx.clearRect(0,0,c.width,c.height);}}

  if(mood===1){ambObj.pts=[];for(var i=0;i<100;i++){var a2=Math.random()*Math.PI*2,r2=10+Math.random()*165;ambObj.pts.push({a:a2,r:r2,va:-0.011-Math.random()*.007,vr:Math.random()<.5?.28:-.22,sz:1.5+Math.random()*2.5,op:.25+Math.random()*.5});}ambObj.flash=0;ambObj.nf=55+Math.random()*70;ambObj.t=0;}

  if(mood===4){ambObj.orbs=[];for(var i=0;i<18;i++)ambObj.orbs.push({x:Math.random()*360,y:280+Math.random()*220,r:7+Math.random()*16,vy:.38+Math.random()*.45,wb:Math.random()*Math.PI*2,op:.15+Math.random()*.18});}
  if(mood===5){ambObj.motes=[];for(var i=0;i<45;i++)ambObj.motes.push({x:Math.random()*360,y:80+Math.random()*440,r:.8+Math.random()*2.2,vy:.2+Math.random()*.45,vx:(Math.random()-.5)*.35,op:.3+Math.random()*.55,pulse:Math.random()*Math.PI*2,bright:Math.random()<.18,dir:.01});}
  function frame(){

    ctx.clearRect(0,0,360,500);

    else if(mood===2){ctx.fillStyle=dark?'rgba(50,60,75,.07)':'rgba(160,175,195,.07)';ctx.fillRect(0,0,360,500);ctx.strokeStyle=dark?'rgba(160,185,210,.55)':'rgba(80,100,120,.42)';ctx.lineWidth=1;ambObj.drops.forEach(function(d){ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-.8,d.y+d.len);ctx.stroke();d.y+=d.vy;if(d.y>510){d.y=-10;d.x=Math.random()*360;}});}
    else if(mood===3){ctx.fillStyle=dark?'rgba(80,100,120,.05)':'rgba(210,222,232,.05)';ctx.fillRect(0,0,360,500);ambObj.clouds.forEach(function(cl){ctx.beginPath();ctx.ellipse(cl.x,cl.y,cl.w,cl.h,0,0,Math.PI*2);ctx.fillStyle=dark?'rgba(140,165,190,'+cl.op+')':'rgba(190,205,218,'+cl.op+')';ctx.fill();cl.x+=cl.vx;if(cl.x>410)cl.x=-cl.w;});}
    else if(mood===4){ctx.fillStyle=dark?'rgba(40,28,8,.07)':'rgba(255,248,225,.07)';ctx.fillRect(0,0,360,500);ambObj.orbs.forEach(function(o){var g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);g.addColorStop(0,dark?'rgba(255,210,80,'+o.op+')':'rgba(255,200,60,'+o.op+')');g.addColorStop(1,'rgba(255,200,60,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();o.y-=o.vy;o.x+=Math.sin(o.wb)*.55;o.wb+=.04;if(o.y<-o.r){o.y=520;o.x=Math.random()*360;}});}
    else if(mood===5){ctx.fillStyle=dark?'rgba(30,20,5,.06)':'rgba(255,248,220,.07)';ctx.fillRect(0,0,360,500);ambObj.motes.forEach(function(m){m.y-=m.vy;m.x+=m.vx+Math.sin(m.pulse)*.3;m.pulse+=.03;if(m.bright){m.op+=m.dir;if(m.op>0.92||m.op<0.2)m.dir*=-1;}if(m.y<-5){m.y=510;m.x=Math.random()*360;m.op=.3+Math.random()*.5;}ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fillStyle=m.bright?'rgba(255,230,70,'+m.op+')':'rgba(255,195,50,'+m.op+')';ctx.fill();if(m.bright&&m.op>0.65){ctx.strokeStyle='rgba(255,240,120,'+(m.op*.5)+')';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(m.x-m.r*2,m.y);ctx.lineTo(m.x+m.r*2,m.y);ctx.stroke();ctx.beginPath();ctx.moveTo(m.x,m.y-m.r*2);ctx.lineTo(m.x,m.y+m.r*2);ctx.stroke();}});}

/* ── Vent / Unsent release: crumple + toss the paper ball up to the icon ── */
function playRelease(cb){
  var icon=Q('dump-icon'),msh=Q('msh');
  if(!icon||!msh){if(cb)cb();return;}
  var ir=icon.getBoundingClientRect(),mr=msh.getBoundingClientRect();
  var tx=ir.left-mr.left+ir.width/2,ty=ir.top-mr.top+ir.height/2;
  var ta=Q('dt');
  var taR=ta?ta.getBoundingClientRect():{left:mr.left+80,top:mr.top+340,width:200,height:70};
  var bx=(taR.left-mr.left)+taR.width/2,by=(taR.top-mr.top)+taR.height/2;
  if(ta){ta.style.transition='transform .22s ease';ta.style.transform='scale(.9) rotate(-2deg)';}
  setTimeout(function(){
    if(ta){ta.style.transition='transform .15s ease';ta.style.transform='scale(1) rotate(0)';}
    var el=document.createElement('canvas');
    el.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:200;pointer-events:none';
    el.width=360;el.height=620;msh.style.position='relative';msh.appendChild(el);
    var ctx=el.getContext('2d'),t=0,total=52;
    var crumple=[];for(var i=0;i<14;i++)crumple.push({a:Math.random()*Math.PI*2,l:4+Math.random()*9,ox:Math.random()*18-9,oy:Math.random()*18-9});
    function eio2(x){return x<.5?2*x*x:-1+(4-2*x)*x;}
    function frame(){
      ctx.clearRect(0,0,360,620);t++;
      var prog=Math.min(t/total,1),ep=eio2(prog);
      var cx=bx+(tx-bx)*ep,cy=by+(ty-by)*ep+Math.sin(prog*Math.PI)*(-140);
      var spin=t*.2;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(spin);
      var g=ctx.createRadialGradient(-3,-3,1,0,0,15);g.addColorStop(0,'#f6f1e3');g.addColorStop(1,'#d4cbb0');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(100,75,45,.24)';ctx.lineWidth=1;
      crumple.forEach(function(ln){ctx.beginPath();ctx.moveTo(ln.ox+Math.cos(ln.a+spin)*3,ln.oy+Math.sin(ln.a+spin)*3);ctx.lineTo(ln.ox+Math.cos(ln.a+spin)*ln.l,ln.oy+Math.sin(ln.a+spin)*ln.l);ctx.stroke();});
      ctx.restore();
      if(prog<1){requestAnimationFrame(frame);}
      else{msh.removeChild(el);icon.classList.add('jiggle');setTimeout(function(){icon.classList.remove('jiggle');if(cb)cb();},450);}
    }
    frame();
  },230);
}

/* ── Envelope: save animation — sealed & flies to the badge (top-left) ── */
function playEnvelope(cb){
  var msh=Q('msh');if(!msh){if(cb)cb();return;}
  var el=document.createElement('canvas');
  el.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:200;pointer-events:none';
  el.width=360;el.height=620;msh.style.position='relative';msh.appendChild(el);
  var ctx=el.getContext('2d'),t=0,total=90,W=360,H=620,ew=100,eh=68,cx=W/2,cy=H/2+40;
  var tx=28,ty=30; /* target: vent badge position */
  function eio(x){return x<.5?2*x*x:-1+(4-2*x)*x;}
  function frame(){
    ctx.clearRect(0,0,W,H);t++;
    var prog=Math.min(t/total,1);
    var ph1=Math.min(prog/0.4,1),ph2=prog>0.4?Math.min((prog-0.4)/0.35,1):0,ph3=prog>0.72?Math.min((prog-0.72)/0.28,1):0;
    var baseScale=eio(ph1)*(1-ph3*0.88);
    var curX=cx+(tx-cx)*eio(ph3);
    var curY=cy+(ty-cy)*eio(ph3);
    var alpha=ph3>0.78?1-(ph3-0.78)/0.22:1;
    ctx.save();ctx.translate(curX,curY);ctx.scale(baseScale,baseScale);ctx.globalAlpha=alpha;
    ctx.shadowColor='rgba(0,0,0,.12)';ctx.shadowBlur=10;ctx.shadowOffsetY=3;
    /* body */
    ctx.fillStyle='#fffbf5';ctx.beginPath();ctx.rect(-ew/2,-eh/2,ew,eh);ctx.fill();
    ctx.shadowColor='transparent';ctx.strokeStyle='#d0bea8';ctx.lineWidth=1.5;ctx.stroke();
    /* bottom V */
    ctx.beginPath();ctx.moveTo(-ew/2,eh/2);ctx.lineTo(0,2);ctx.lineTo(ew/2,eh/2);ctx.strokeStyle='#d0bea8';ctx.lineWidth=1;ctx.stroke();
    /* side folds */
    ctx.beginPath();ctx.moveTo(-ew/2,-eh/2);ctx.lineTo(-ew/2+12,eh/2);ctx.moveTo(ew/2,-eh/2);ctx.lineTo(ew/2-12,eh/2);ctx.strokeStyle='rgba(208,190,168,.45)';ctx.stroke();
    /* flap: opens then closes */
    var flapTip=eh*0.46*(1-ph2*2);
    ctx.save();ctx.translate(0,-eh/2);
    ctx.beginPath();ctx.moveTo(-ew/2,0);ctx.lineTo(0,flapTip);ctx.lineTo(ew/2,0);ctx.closePath();
    ctx.fillStyle='#f5ece0';ctx.fill();ctx.strokeStyle='#d0bea8';ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();
    /* wax seal */
    if(ph2>0.85){var sa=(ph2-0.85)/0.15;ctx.beginPath();ctx.arc(0,0,13*sa,0,Math.PI*2);ctx.fillStyle='rgba(200,112,58,'+sa+')';ctx.fill();if(sa>0.6){ctx.font='bold 9px DM Serif Display';ctx.fillStyle='rgba(255,245,235,'+(sa*2-1)+')';ctx.textAlign='center';ctx.fillText('A',0,3);ctx.textAlign='left';}}
    ctx.restore();
    if(t<total){requestAnimationFrame(frame);}else{msh.removeChild(el);if(cb)cb();}
  }
  frame();
}

/* ── Balloon: WCS release — flies in from bottom then POPS ── */
function playBalloon(text,cb){
  var msh=Q('msh');if(!msh){if(cb)cb();return;}
  var el=document.createElement('canvas');
  el.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:200;pointer-events:none';
  el.width=360;el.height=620;msh.style.position='relative';msh.appendChild(el);
  var ctx=el.getContext('2d'),t=0,total=110,W=360,H=620;
  var bx=W/2,peakY=H*0.3,startY=H+90;
  var particles=[],popped=false;
  function eOut(x){return 1-Math.pow(1-x,2);}
  function drawBln(x,y,sway){
    var r=46;
    ctx.save();ctx.translate(x+sway,y);
    ctx.beginPath();ctx.moveTo(0,r*1.12+8);
    for(var i=0;i<=16;i++){var si=i/16;ctx.lineTo(Math.sin(si*Math.PI*2+t*0.08)*5,r*1.12+8+si*52);}
    ctx.strokeStyle='rgba(110,70,40,.4)';ctx.lineWidth=1.2;ctx.stroke();
    ctx.beginPath();ctx.ellipse(0,-4,r,r*1.12,0,0,Math.PI*2);ctx.fillStyle='#e86060';ctx.fill();
    var grd=ctx.createRadialGradient(-r*.28,-r*.35,2,0,-4,r);
    grd.addColorStop(0,'rgba(255,255,255,.38)');grd.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=grd;ctx.beginPath();ctx.ellipse(0,-4,r,r*1.12,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(-5,r*1.12+2);ctx.quadraticCurveTo(0,r*1.12+14,5,r*1.12+2);ctx.fillStyle='#b03030';ctx.fill();
    ctx.fillStyle='rgba(80,15,15,.7)';ctx.font='500 7px DM Sans';ctx.textAlign='center';
    var words=(text||'').slice(0,55).split(' '),lines=[],line='';
    words.forEach(function(w){var test=(line?line+' ':'')+w;if(ctx.measureText(test).width>r*1.5){lines.push(line);line=w;}else line=test;});
    if(line)lines.push(line);
    var lh=10,ts=-(lines.slice(0,5).length*lh)/2+lh/2;
    lines.slice(0,5).forEach(function(l,i){ctx.fillText(l,0,ts+i*lh-4);});
    ctx.restore();
  }
  function frame(){
    ctx.clearRect(0,0,W,H);t++;
    var prog=Math.min(t/total,1);
    var ph1=Math.min(prog/0.5,1);  /* fly in */
    var ph2=prog>0.5?Math.min((prog-0.5)/0.15,1):0;  /* hover at peak */
    var ph3=prog>0.65?Math.min((prog-0.65)/0.35,1):0; /* pop + particles */
    var by=startY+(peakY-startY)*eOut(ph1);
    var sway=Math.sin(t*0.1)*12*ph1*(1-ph3);
    if(!popped&&ph3>0){
      popped=true;
      for(var k=0;k<20;k++){var a=k*(Math.PI*2/20);particles.push({x:bx,y:peakY,vx:Math.cos(a)*(3+Math.random()*5),vy:Math.sin(a)*(3+Math.random()*5)-1,r:3+Math.random()*5,col:'hsl('+(k*18)+',78%,58%)',a:1});}
      for(var k=0;k<10;k++){particles.push({x:bx+(Math.random()-.5)*40,y:peakY+(Math.random()-.5)*40,vx:(Math.random()-.5)*7,vy:-Math.random()*6-2,r:4+Math.random()*3,col:'#e86060',a:1});}
    }
    if(ph3===0){drawBln(bx,by,sway);}
    if(ph3>0){
      if(ph3<0.35){var pa=1-ph3/0.35;ctx.save();ctx.translate(bx,peakY);ctx.globalAlpha=pa;ctx.font='bold 40px DM Serif Display';ctx.fillStyle='#e86060';ctx.textAlign='center';ctx.fillText('POP!',0,12);ctx.restore();}
      particles.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.a=Math.max(0,p.a-0.022);ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fillStyle=p.col;ctx.fill();ctx.restore();});
    }
    if(t<total){requestAnimationFrame(frame);}else{msh.removeChild(el);if(cb)cb();}
  }
  frame();
}

/* ── Letters: paper sheet floats up and dissolves into sparks ── */
function playLetterRelease(cb){
  var msh=Q('msh');if(!msh){if(cb)cb();return;}
  var el=document.createElement('canvas');
  el.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:200;pointer-events:none';
  el.width=360;el.height=620;msh.style.position='relative';msh.appendChild(el);
  var ctx=el.getContext('2d'),t=0,total=80,W=360,H=620;
  var sparks=[];
  for(var k=0;k<16;k++)sparks.push({x:(Math.random()-.5)*90,y:(Math.random()-.5)*70,vx:(Math.random()-.5)*3.5,vy:-Math.random()*3-1,a:0.9,s:2+Math.random()*4,col:'hsl('+(15+Math.random()*50)+',75%,62%)'});
  function eOut(x){return 1-Math.pow(1-x,3);}
  function frame(){
    ctx.clearRect(0,0,W,H);t++;
    var prog=Math.min(t/total,1);
    var cx=W/2,startCy=H/2+30;
    var y=startCy-eOut(prog)*270;
    var alpha=prog>0.55?1-(prog-0.55)/0.45:1;
    var rot=(prog-.5)*0.6;
    ctx.save();ctx.translate(cx,y);ctx.rotate(rot);ctx.globalAlpha=alpha;
    ctx.shadowColor='rgba(0,0,0,.08)';ctx.shadowBlur=8;
    ctx.fillStyle='#fffbf5';ctx.beginPath();ctx.rect(-40,-54,80,100);ctx.fill();
    ctx.shadowColor='transparent';ctx.strokeStyle='#d0bea8';ctx.lineWidth=1.5;ctx.stroke();
    [0,1,2,3].forEach(function(i){ctx.beginPath();ctx.moveTo(-24,-28+i*18);ctx.lineTo(24,-28+i*18);ctx.strokeStyle='rgba(180,150,110,.3)';ctx.lineWidth=1;ctx.stroke();});
    ctx.font='italic 11px DM Serif Display';ctx.fillStyle='rgba(160,120,80,.4)';ctx.textAlign='center';ctx.fillText('✉',0,30);
    ctx.restore();
    sparks.forEach(function(sp){
      sp.x+=sp.vx;sp.y+=sp.vy;sp.vy+=0.05;sp.a=Math.max(0,sp.a-0.013);
      ctx.save();ctx.translate(cx+sp.x,startCy+sp.y-eOut(prog)*250);ctx.globalAlpha=sp.a;
      ctx.beginPath();ctx.arc(0,0,sp.s,0,Math.PI*2);ctx.fillStyle=sp.col;ctx.fill();
      ctx.restore();
    });
    if(t<total){requestAnimationFrame(frame);}else{msh.removeChild(el);if(cb)cb();}
  }
  frame();
}

/* ── Breathing ── */
var PH=[{l:'inhale',i:'Breathe in slowly through your nose',d:4,s:1.0},{l:'exhale',i:'Breathe out slowly through your mouth',d:8,s:.42}];
function eio(t){return t<.5?2*t*t:-1+(4-2*t)*t;}

/* ── NOTIFICATIONS ── */
function checkDailyNotif(){
  if(isIOS||!S.notifEnabled)return;
  if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
  var now=new Date();
  var pad=function(n){return n<10?'0'+n:''+n;};
  var todayStr=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  var parts=(S.notifTime||'09:00').split(':');
  var nh=parseInt(parts[0])||9,nm2=parseInt(parts[1])||0;
  if(now.getHours()<nh||(now.getHours()===nh&&now.getMinutes()<nm2))return;
  /* Mood reminder */
  var todayArr=getMoodArr(todayStr),logged=todayArr&&todayArr.length>0;
  if(S.lastNotifDate!==todayStr&&!logged){
    try{new Notification('Anxiously Okay',{body:'Hey '+(S.name||'there')+'. How are you feeling today? No pressure — I\'m just checking in.',icon:'/favicon.ico'});}catch(e){}
    S.lastNotifDate=todayStr;saveS();
  }
  /* 3 tough days notification */
  if(S.lastSupNotifDate!==todayStr){
    var hard=0;
    for(var i=1;i<=3;i++){
      var dt=new Date(now);dt.setDate(dt.getDate()-i);
      var ds=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
      var arr=getMoodArr(ds);
      if(arr&&arr.length>0&&arr.every(function(e){return e.mood<=2;}))hard++;
    }
    if(hard>=3){
      var msgs=['You\'ve had a tough few days. Writing it out might help — try the vent or a letter.','You\'ve been carrying a lot lately. Come breathe with us whenever you\'re ready.','Three hard days in a row. You don\'t have to figure it all out today — just breathe.'];
      var msg=msgs[Math.floor(Math.random()*msgs.length)];
      setTimeout(function(){try{new Notification('Anxiously Okay',{body:msg,icon:'/favicon.ico'});}catch(e){}},4000);
      S.lastSupNotifDate=todayStr;saveS();
    }
  }
}

/* ── MOOD ── */
function getInsight(){
  var ec=Object.keys(S.moodHist).length;
  var pool=[];
  /* Universal truths — always positive, safe for first-time users */
  pool.push('You\'ve survived every difficult day so far. That\'s all of them.');
  pool.push('Feelings aren\'t facts. You don\'t have to believe everything your mind tells you today.');
  pool.push('Small steps still move you forward. Even the tiniest ones count.');
  pool.push('You don\'t have to have it all figured out today. Just being here is enough.');
  /* Only show a past-difficulty insight if there IS mood history with hard days */
  if(ec>2){var hasHard=Object.keys(S.moodHist).some(function(k){var arr=getMoodArr(k);return arr.some(function(e){return e.mood<=2;});});if(hasHard)pool.push('You\'ve been through hard days before and found your way through every single one.');}
  /* Data-driven insights */
  if(S.streak>0)pool.push('You\'ve logged in for '+S.streak+(S.streak===1?' day':' days')+'. You\'ve shown up every single one of them.');
  if(S.ventLog.length>0)pool.push('You\'ve written '+S.ventLog.length+' thing'+(S.ventLog.length===1?'':'s')+' down. Every one of them mattered.');
  /* Day pattern */
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var today=new Date().getDay();var dayName=days[today];
  var dayCounts={};
  Object.keys(S.moodHist).forEach(function(k){var arr=getMoodArr(k);if(!arr.length)return;var d=new Date(k+'T12:00:00');if(isNaN(d))return;var dow=d.getDay();var m=arr[arr.length-1].mood;if(!dayCounts[dow])dayCounts[dow]={sum:0,cnt:0};dayCounts[dow].sum+=m;dayCounts[dow].cnt++;});
  if(dayCounts[today]&&dayCounts[today].cnt>=2){var avg=dayCounts[today].sum/dayCounts[today].cnt;pool.push('You usually feel '+MN[Math.round(avg)]+' on '+dayName+'s. Today might be one of those days — or it might surprise you.');}
  /* Pick by date so it's stable per day */
  var seed=new Date().getFullYear()*10000+(new Date().getMonth()+1)*100+new Date().getDate();
  return pool[seed%pool.length];
}

/* ── VENT HISTORY ── */
function drawVentHistory(){
  var byMonth={},order=[];
  S.ventLog.forEach(function(v,i){
    var key=v.isoDate?v.isoDate.slice(0,7):(v.date||'Earlier');
    if(!byMonth[key]){byMonth[key]=[];order.push(key);}
    byMonth[key].push({v:v,i:i});
  });
  var body='<div class="serif" style="font-size:21px;color:var(--text);margin-top:4px;margin-bottom:3px">Past <em>Vents</em></div>'+
    '<div class="serif" style="font-size:13px;font-style:italic;color:var(--t2);margin-bottom:10px;line-height:1.5">The things you wrote down and kept. Only you can see them.</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:14px">'+
      '<button id="vsort-month" style="padding:5px 14px;border-radius:16px;font-size:12px;font-family:\'DM Sans\',sans-serif;cursor:pointer;font-weight:500;border:1.5px solid '+(ventSortByDay?'var(--bdr)':'var(--grn)')+';background:'+(ventSortByDay?'var(--bg2)':'var(--gbg)')+';color:'+(ventSortByDay?'var(--t2)':'var(--gt)')+'">By month</button>'+
      '<button id="vsort-day" style="padding:5px 14px;border-radius:16px;font-size:12px;font-family:\'DM Sans\',sans-serif;cursor:pointer;font-weight:500;border:1.5px solid '+(ventSortByDay?'var(--grn)':'var(--bdr)')+';background:'+(ventSortByDay?'var(--gbg)':'var(--bg2)')+';color:'+(ventSortByDay?'var(--gt)':'var(--t2)')+'">By day</button>'+
    '</div>';
  if(ventAddedMsg)body+='<div class="bnr"><i class="ti ti-circle-check" style="font-size:18px;color:var(--grn)"></i>'+esc(ventAddedMsg)+'</div>';
  if(S.ventHistDate!==undefined){
    body+='<div style="background:var(--gbg);border:1.5px solid var(--gbdr);border-radius:10px;padding:10px 12px;margin-bottom:10px"><div style="font-size:11px;font-weight:600;color:var(--gt);margin-bottom:6px">AN EARLIER DAY</div>'+
      '<input type="date" id="vh-date" max="'+crTodayStr()+'" value="'+(S.ventHistDate||'')+'" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1.5px solid var(--gbdr);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;margin-bottom:6px">'+
      '<textarea id="vh-ta" rows="3" placeholder="What happened that day?" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid var(--gbdr);border-radius:8px;font-size:14px;background:var(--bg);color:var(--text);resize:none;font-family:\'DM Sans\',sans-serif;margin-bottom:6px"></textarea>'+
      '<div style="display:flex;gap:8px"><button id="vh-save" style="flex:1;padding:9px;background:var(--gbg);color:var(--gt);border:1.5px solid var(--gbdr);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:\'DM Sans\',sans-serif">Keep it</button>'+
      '<button id="vh-cancel" style="padding:9px 14px;background:var(--bg2);color:var(--t2);border:.5px solid var(--bdr);border-radius:10px;font-size:13px;cursor:pointer;font-family:\'DM Sans\',sans-serif">Cancel</button></div></div>';
  }
  body+='<button id="vh-addpast" style="display:block;width:100%;padding:9px;background:var(--bg2);color:var(--acc);border:.5px solid var(--bdr);border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;font-family:\'DM Sans\',sans-serif;margin-bottom:14px">+ Write about an earlier day</button>';
  if(S.ventLog.length===0){
    body+='<div class="serif" style="font-size:13px;font-style:italic;color:var(--t2);text-align:center;padding:30px 0">Nothing here yet. Whenever something feels heavy, you can set it down here.</div>';
  } else if(ventSortByDay){
    S.ventLog.forEach(function(v,i){
      body+='<div class="jent"><div style="font-size:11px;color:var(--t3);margin-bottom:4px">'+esc(v.date||v.isoDate||'')+'</div>'+
        '<div style="font-size:14px;color:var(--text);line-height:1.5;margin-bottom:8px">'+esc(v.text)+'</div>'+
        '<div style="display:flex;gap:8px">'+
        '<button data-vhedit="'+i+'" style="font-size:12px;color:var(--acc);background:none;border:none;cursor:pointer;padding:0;font-family:\'DM Sans\',sans-serif">Edit</button>'+
        '<button data-vhdel="'+i+'" style="font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;padding:0;font-family:\'DM Sans\',sans-serif">Delete</button></div></div>';
    });
  } else {
    order.forEach(function(key,idx){
      var label=key.length===7?new Date(key+'-02').toLocaleDateString('en-US',{month:'long',year:'numeric'}):key;
      if(ventCollapsed[key]===undefined){ventCollapsed[key]=(idx>0);} /* most recent open, rest collapsed */
      var collapsed=ventCollapsed[key];
      body+='<div data-vhmonth="'+key+'" style="display:flex;align-items:center;justify-content:space-between;margin:12px 0 6px;cursor:pointer;user-select:none">'+
        '<div style="font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.05em;text-transform:uppercase">'+label+'</div>'+
        '<div style="font-size:10px;color:var(--t3);display:flex;align-items:center;gap:4px">'+byMonth[key].length+(collapsed?' ▶':' ▼')+'</div>'+
      '</div>';
      if(!collapsed){
        byMonth[key].forEach(function(item){
          body+='<div class="jent"><div style="font-size:11px;color:var(--t3);margin-bottom:4px">'+esc(item.v.date||item.v.isoDate||'')+'</div>'+
            '<div style="font-size:14px;color:var(--text);line-height:1.5;margin-bottom:8px">'+esc(item.v.text)+'</div>'+
            '<div style="display:flex;gap:8px">'+
            '<button data-vhedit="'+item.i+'" style="font-size:12px;color:var(--acc);background:none;border:none;cursor:pointer;padding:0;font-family:\'DM Sans\',sans-serif">Edit</button>'+
            '<button data-vhdel="'+item.i+'" style="font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;padding:0;font-family:\'DM Sans\',sans-serif">Delete</button></div></div>';
        });
      }
    });
  }
  shell('<button class="bk" id="vhbk"><i class="ti ti-arrow-left" style="font-size:18px"></i>Back</button><span class="tbt">past vents</span>',body,false);
  Q('vhbk').onclick=function(){go('mood');};
  var vsm=Q('vsort-month');if(vsm)vsm.onclick=function(){ventSortByDay=false;drawVentHistory();};
  var vsd=Q('vsort-day');if(vsd)vsd.onclick=function(){ventSortByDay=true;drawVentHistory();};
  var vhaddpast=Q('vh-addpast');if(vhaddpast)vhaddpast.onclick=function(){S.ventHistDate='';drawVentHistory();};
  var vhcancel=Q('vh-cancel');if(vhcancel)vhcancel.onclick=function(){S.ventHistDate=undefined;drawVentHistory();};
  var vhsave=Q('vh-save');if(vhsave)vhsave.onclick=function(){
    var dt=Q('vh-date'),ta=Q('vh-ta');
    var iso=dt?dt.value:'';var txt=ta?ta.value.trim():'';
    if(!iso||!txt)return;
    var d=new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
    S.ventLog.push({text:txt,date:d,isoDate:iso});
    S.ventLog.sort(function(a,b){var da=a.isoDate||'0',db=b.isoDate||'0';return da>db?-1:da<db?1:0;});
    var dObj=new Date(iso+'T00:00:00');
    var nice=dObj.toLocaleDateString('en-US',dObj.getFullYear()===new Date().getFullYear()?{weekday:'long',month:'long',day:'numeric'}:{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    ventAddedMsg='Added for '+nice+'.';
    if(ventAddedTimer)clearTimeout(ventAddedTimer);
    ventAddedTimer=setTimeout(function(){ventAddedMsg='';ventAddedTimer=null;if(S.scr==='venthistory')drawVentHistory();},3000);
    S.ventHistDate=undefined;saveS();drawVentHistory();
  };
  document.querySelectorAll('[data-vhmonth]').forEach(function(el){el.onclick=function(){var k=el.dataset.vhmonth;ventCollapsed[k]=!ventCollapsed[k];drawVentHistory();};});
  document.querySelectorAll('[data-vhedit]').forEach(function(b){b.onclick=function(){
    var i=parseInt(b.dataset.vhedit);S.dump=S.ventLog[i].text;S.ventEditIdx=i;go('mood');
  };});
  document.querySelectorAll('[data-vhdel]').forEach(function(b){b.onclick=function(){
    S.ventLog.splice(parseInt(b.dataset.vhdel),1);saveS();drawVentHistory();
  };});
}

/* ── WORST CASE SCENARIO ── */
function drawWCS(){
  var body='<div class="serif" style="font-size:21px;color:var(--text);margin-top:4px;margin-bottom:3px">Worst Case <em>Scenario</em></div>';
  body+='<div class="serif" style="font-size:13px;font-style:italic;color:var(--t2);margin-bottom:14px;line-height:1.5">Write down the worst that could happen. Sometimes seeing it on paper takes some of its power away.</div>';
  if(S.wcsEditIdx!==-1) body+='<div style="background:var(--gbg);border:1.5px solid var(--gbdr);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:12px;color:var(--gt)">You\'re changing something you wrote earlier. Keep it, or let it go.</div>';
  if(S.wcsSaved) body+='<div class="bnr"><i class="ti ti-mail" style="font-size:18px;color:var(--grn)"></i>Tucked away safely. It\'s yours.</div>';
  body+='<textarea class="ta" id="dt" rows="4" placeholder="What\'s the absolute worst that happens…?" style="margin-bottom:10px">'+S.wcsDraft+'</textarea>';
  body+='<div style="display:flex;gap:8px;margin-bottom:16px">'+
    '<button id="wcs-save" style="flex:1;padding:11px;background:var(--gbg);color:var(--gt);border:1.5px solid var(--gbdr);border-radius:12px;font-family:\'DM Sans\',sans-serif;font-size:14px;font-weight:500;cursor:pointer">'+(S.wcsEditIdx!==-1?'Update 📬':'Save 📬')+'</button>'+
    (S.wcsEditIdx!==-1?'<button id="wcs-cancel" style="padding:11px 14px;background:var(--bg2);color:var(--t2);border:1.5px solid var(--bdr);border-radius:12px;font-family:\'DM Sans\',sans-serif;font-size:14px;cursor:pointer">Cancel</button>':'')+
    '<button id="wcs-rel" style="flex:1;padding:11px;background:var(--sos);color:var(--sost);border:1.5px solid var(--sosbdr);border-radius:12px;font-family:\'DM Sans\',sans-serif;font-size:14px;font-weight:500;cursor:pointer">Release 🎈</button>'+
  '</div>';
  if(S.wcsLog.length>0){
    body+='<div style="border-top:.5px solid var(--bdr);margin-bottom:12px"></div>';
    body+='<div style="font-size:11px;color:var(--t2);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px">the ones you kept</div>';
    body+=S.wcsLog.slice(0,5).map(function(e,i){
      return '<div class="jent"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px"><div style="font-size:11px;color:var(--t3)">'+e.date+'</div></div><div style="font-size:13px;color:var(--text);line-height:1.5">'+e.text.slice(0,100)+(e.text.length>100?'…':'')+'</div><div style="display:flex;gap:10px;margin-top:6px"><button data-wcsedit="'+i+'" style="font-size:12px;color:var(--grn);background:none;border:none;cursor:pointer;font-family:\'DM Sans\',sans-serif;font-weight:500">Edit</button><button data-wcsdel="'+i+'" style="font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;font-family:\'DM Sans\',sans-serif">× Delete</button></div></div>';
    }).join('');
  }
  shell('<button class="bk" id="wcsbk"><i class="ti ti-arrow-left" style="font-size:18px"></i>Back</button><span class="tbt">worst case</span>', body, true);
  Q('wcsbk').onclick=function(){go('support');};
  var wt=Q('dt');if(wt)wt.oninput=function(e){S.wcsDraft=e.target.value;};
  var ws=Q('wcs-save');if(ws)ws.onclick=function(){
    var ta=Q('dt');var txt=(ta?ta.value.trim():'')||S.wcsDraft.trim();if(!txt)return;
    if(ta)ta.value='';
    playEnvelope(function(){
      var d=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
      if(S.wcsEditIdx!==-1){S.wcsLog[S.wcsEditIdx]={text:txt,date:d};S.wcsEditIdx=-1;}
      else{S.wcsLog.unshift({text:txt,date:d});}
      S.wcsDraft='';S.wcsSaved=true;drawWCS();setTimeout(function(){S.wcsSaved=false;drawWCS();},3000);
    });
  };
  var wcancel=Q('wcs-cancel');if(wcancel)wcancel.onclick=function(){S.wcsDraft='';S.wcsEditIdx=-1;drawWCS();};
  var wr=Q('wcs-rel');if(wr)wr.onclick=function(){
    var ta=Q('dt');var txt=(ta?ta.value.trim():'')||S.wcsDraft.trim();if(!txt)return;
    if(ta)ta.value='';S.wcsEditIdx=-1;
    playBalloon(txt,function(){S.wcsDraft='';drawWCS();});
  };
  document.querySelectorAll('[data-wcsedit]').forEach(function(b){b.onclick=function(){var i=parseInt(b.dataset.wcsedit);S.wcsDraft=S.wcsLog[i].text;S.wcsEditIdx=i;drawWCS();};});
  document.querySelectorAll('[data-wcsdel]').forEach(function(b){b.onclick=function(){S.wcsLog.splice(parseInt(b.dataset.wcsdel),1);drawWCS();};});
}

    }).join('')+

    '<button class="btn" id="js" style="margin-bottom:20px">'+(S.winEditIdx!==-1?'Update wins ✨':'Save today\'s wins ✨')+'</button>'+
    '<div style="border-top:.5px solid var(--bdr);margin-bottom:14px"></div>'+
    '<div style="font-size:11px;color:var(--t2);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px">recent wins</div>'+
    (S.jlog.length===0?
      '<div style="text-align:center;padding:20px 0;color:var(--t3)"><div style="font-size:24px;margin-bottom:8px">🌟</div><div style="font-size:13px;font-style:italic">Your wins will live here.<br>Something small from every day.</div></div>':
      S.jlog.slice(0,5).map(function(e,i){return '<div class="jent"><div style="font-size:11px;color:var(--t3);margin-bottom:5px">'+e.date+'</div>'+e.items.map(function(it){return '<div style="font-size:13px;color:var(--text);padding:2px 0;display:flex;gap:8px"><span style="font-size:10px;color:#d4a040;margin-top:3px;flex-shrink:0">★</span>'+it+'</div>';}).join('')+'<div style="display:flex;gap:10px;margin-top:6px"><button data-wedit="'+i+'" style="font-size:12px;color:var(--grn);background:none;border:none;cursor:pointer;font-family:\'DM Sans\',sans-serif;font-weight:500">Edit</button><button data-wdel="'+i+'" style="font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;font-family:\'DM Sans\',sans-serif">× Delete</button></div></div>';}).join('')
    ),true);
  Q('wb').onclick=function(){S.myCornerTab=null;go('mycorner');};
  [0,1,2].forEach(function(i){var e=Q('jv'+i);if(e)e.oninput=function(ev){S.jv[i]=ev.target.value;};});
  var jcancel=Q('jcancel');if(jcancel)jcancel.onclick=function(){S.jv=['','',''];S.winEditIdx=-1;drawWins();};
  Q('js').onclick=function(){
    var filled=S.jv.filter(function(v){return v.trim();});if(!filled.length)return;
    var n=new Date();var entry={date:n.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}),ts:n.getTime(),items:filled.slice()};
    if(S.winEditIdx!==-1){S.jlog[S.winEditIdx]=entry;S.winEditIdx=-1;}else{S.jlog.unshift(entry);}

    var i=parseInt(b.dataset.wedit);var e=S.jlog[i];
    S.jv=[e.items[0]||'',e.items[1]||'',e.items[2]||''];S.winEditIdx=i;drawWins();
  };});
  document.querySelectorAll('[data-wdel]').forEach(function(b){b.onclick=function(){S.jlog.splice(parseInt(b.dataset.wdel),1);drawWins();};});
}

function initBreathBub(){
  var W=360,H=460;
  gShell('Breathing Bubbles','','bbub',W,H,false);
  setTimeout(function(){
    var c=Q('bbub');if(!c)return;
    var ctx=c.getContext('2d');
    var cx=W/2,cy=H/2-20;
    var minR=40,maxR=110,curR=minR,targetR=minR;
    var pressing=false,lastT=0;
    var spd=0;
    function drawBubble(t){
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#e8f4ff';ctx.fillRect(0,0,W,H);
      var r=curR;
      var rip=r+20+Math.sin(t*0.003)*8;
      var g2=ctx.createRadialGradient(cx,cy,r,cx,cy,rip+10);
      g2.addColorStop(0,'rgba(100,170,240,.2)');g2.addColorStop(1,'rgba(100,170,240,0)');
      ctx.beginPath();ctx.arc(cx,cy,rip+10,0,Math.PI*2);ctx.fillStyle=g2;ctx.fill();
      var g=ctx.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);
      g.addColorStop(0,'rgba(255,255,255,.9)');
      g.addColorStop(.4,'rgba(140,190,240,.85)');
      g.addColorStop(1,'rgba(60,130,210,.7)');
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.stroke();
      var label=pressing?'breathe in':'breathe out';
      if(curR<=minR+2)label='hold to breathe in';
      ctx.fillStyle='rgba(30,80,140,.85)';ctx.font='bold 15px DM Sans,sans-serif';ctx.textAlign='center';
      ctx.fillText(label,cx,cy+r+30);
      var guide=pressing?'in for 4':'out for 8';
      if(curR>minR+2){ctx.fillStyle='rgba(60,120,200,.5)';ctx.font='12px DM Sans,sans-serif';ctx.fillText(guide,cx,cy+r+48);}
    }
    function frame(t){
      var dt=(t-lastT)/1000;if(lastT===0)dt=0;lastT=t;
      if(pressing){targetR=maxR;spd=Math.min(spd+dt*50,80);}
      else{targetR=minR;spd=Math.max(spd-dt*30,20);}
      if(pressing&&curR<targetR)curR=Math.min(curR+spd*dt,targetR);
      else if(!pressing&&curR>targetR)curR=Math.max(curR-spd*dt*.6,targetR);
      drawBubble(t);
      gLoop=requestAnimationFrame(frame);
    }
    function onDown(){pressing=true;}
    function onUp(){pressing=false;}
    c.addEventListener('mousedown',onDown);c.addEventListener('mouseup',onUp);c.addEventListener('mouseleave',onUp);
    c.addEventListener('touchstart',function(e){e.preventDefault();onDown();},{passive:false});
    c.addEventListener('touchend',function(e){e.preventDefault();onUp();},{passive:false});
    gLoop=requestAnimationFrame(frame);
    var bk=Q('gbk');if(bk)bk.onclick=function(){stopGame();go('calm');};
  },50);
}

        for(var i=0;i<6;i++){var a=-Math.PI/2+i*(Math.PI/3)+Math.PI/6;rs.push({cx:cx+Math.cos(a)*92,cy:cy+Math.sin(a)*92,r:22,ci:0});}

      /* Stage 8 — Galaxy Spiral */
      {name:'Galaxy',bg:'#0e0b1a',regions:(function(){

        fallParticles.forEach(function(fp){fp.x+=fp.vx;fp.y+=fp.vy;fp.vy+=.22;fp.rot+=fp.vr;fp.a=Math.max(0,fp.a-.007);if(fp.a>0)done=false;});
        drawScene();
        if(done){fallParticles=[];falling=false;drawScene();return;}
        gLoop=requestAnimationFrame(fl);
      }
      fl();
    }
    function addStone(){
      if(falling)return;
      stones.push(mkStone());drawScene();
      var toppleChance=stones.length>=7?Math.min(.60,(stones.length-6)*.18):0;
      if(Math.random()<toppleChance)setTimeout(tumble,300);
    }
    drawScene();
    c.addEventListener('click',function(e){e.preventDefault();addStone();});
    c.addEventListener('touchend',function(e){e.preventDefault();addStone();},{passive:false});
    var bk=Q('gbk');if(bk)bk.onclick=function(){stopGame();go('calm');};
  },60);
}

function initBreathBubble(){
  gShell('Breathing Bubbles','','bbl',360,460,false);
  setTimeout(function(){
    var c=Q('bbl');if(!c)return;
    var ctx=c.getContext('2d'),W=360,H=460;
    var held=false,r=90,minR=90,maxR=175,spd=1.3,phase='';
    function loop(){
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle=dark?'#0d1520':'#eef5fb';
      ctx.fillRect(0,0,W,H);
      var prog=(r-minR)/(maxR-minR);
      /* outer glow */
      var gOuter=ctx.createRadialGradient(W/2,H/2-20,r,W/2,H/2-20,r*1.55);
      gOuter.addColorStop(0,'rgba(100,170,240,'+(0.12*prog)+')');
      gOuter.addColorStop(1,'rgba(100,170,240,0)');
      ctx.beginPath();ctx.arc(W/2,H/2-20,r*1.55,0,Math.PI*2);ctx.fillStyle=gOuter;ctx.fill();
      /* bubble */
      var bg=ctx.createRadialGradient(W/2-r*0.28,H/2-20-r*0.3,r*0.08,W/2,H/2-20,r);
      bg.addColorStop(0,'rgba(190,225,255,'+(0.7+prog*0.25)+')');
      bg.addColorStop(0.6,'rgba(120,185,240,'+(0.5+prog*0.2)+')');
      bg.addColorStop(1,'rgba(80,145,220,'+(0.3+prog*0.2)+')');
      ctx.beginPath();ctx.arc(W/2,H/2-20,r,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
      /* highlight */
      ctx.beginPath();ctx.arc(W/2-r*0.28,H/2-20-r*0.3,r*0.22,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+(0.28+prog*0.15)+')';ctx.fill();
      /* phase label */
      if(phase){
        ctx.font='italic 14px "DM Serif Display",serif';
        ctx.textAlign='center';
        ctx.fillStyle=dark?'rgba(180,220,255,.9)':'rgba(30,80,140,'+(0.55+prog*0.35)+')';
        ctx.fillText(phase,W/2,H/2-20+6);
      }
      /* hint */
      ctx.font='12px "DM Sans",sans-serif';
      ctx.fillStyle=dark?'rgba(130,170,210,.4)':'rgba(70,120,170,.35)';
      ctx.fillText('hold to breathe in  ·  release to breathe out',W/2,H-22);
      ctx.textAlign='left';
      /* advance radius */
      if(held&&r<maxR)r=Math.min(maxR,r+spd);
      else if(!held&&r>minR)r=Math.max(minR,r-spd*0.7);
      phase=(held&&r<maxR)?'breathe in…':(!held&&r>minR+4)?'breathe out…':'';
      gLoop=requestAnimationFrame(loop);
    }
    c.addEventListener('mousedown',function(){held=true;});
    c.addEventListener('mouseup',function(){held=false;});
    c.addEventListener('mouseleave',function(){held=false;});
    c.addEventListener('touchstart',function(e){e.preventDefault();held=true;},{passive:false});
    c.addEventListener('touchend',function(e){e.preventDefault();held=false;},{passive:false});
    c.addEventListener('touchcancel',function(){held=false;});
    loop();
  },60);
}

  function songStub(sg,i){

    '</a>';

  var today=new Date();today.setHours(0,0,0,0);

  function envelope(n,i,isOpen){

      return '<div style="position:relative;background:'+envBg+';border-radius:5px;padding:12px 28px 12px 12px;margin-bottom:12px;box-shadow:1px 2px 6px rgba(0,0,0,'+(dark?'.35':'.1')+')">'+

          '<div style="position:absolute;top:0;left:0;right:0;height:44%;background:linear-gradient(135deg,'+(dark?'rgba(80,60,20,.4)':'#cfc0a0')+' 50%,transparent 50%);border-radius:6px 6px 0 0;opacity:.5"></div>'+

  /* ── COVER PAGE ── */

        '<div style="position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(3deg);width:44px;height:15px;background:'+p.wall+';opacity:.75"></div>'+
        (firstPhoto?'<img src="'+firstPhoto.url+'" alt="" style="width:96px;height:96px;object-fit:cover;display:block">':

        '<span style="position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:\'Caveat\',cursive;font-size:17px;color:#4a3a28">Memories</span>'+

    var noteObj='<button class="cr-obj" data-crsec="1" aria-label="Affirmations" style="transform:rotate(3deg)">'+

        '<div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:'+p.accent+';box-shadow:0 1px 3px rgba(0,0,0,.3)"></div>'+

          '<div style="flex:1;display:flex;align-items:center;justify-content:center;font-family:\'Caveat\',cursive;font-size:16px;color:'+noteTxt+';opacity:.7;text-align:center">pin up something kind</div>')+

        '<div style="position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49%,rgba(120,90,40,.25) 50%,transparent 52%),linear-gradient(to bottom left,transparent 49%,rgba(120,90,40,.25) 50%,transparent 52%)"></div>'+
        '<div style="position:absolute;top:15px;left:50%;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:'+p.accent+'"></div>'+
      '</div>'+
      '</button>';

    var tapeObj='<button class="cr-obj" data-crsec="4" aria-label="Voices">'+

        '<div style="width:50px;height:18px;border-radius:9px;background:'+(dark?'#d8c8a4':'#f3e7cc')+';display:flex;align-items:center;justify-content:space-between;padding:0 4px">'+
          '<span style="width:11px;height:11px;border-radius:50%;border:2.5px solid #5a4a3c"></span><span style="width:11px;height:11px;border-radius:50%;border:2.5px solid #5a4a3c"></span>'+

        /* companion */
        '<div style="text-align:center;margin-bottom:18px">'+
          '<div id="cr-companion" role="button" tabindex="0" aria-label="'+esc(S.crMascotName)+' — tap to redecorate" style="cursor:pointer;display:inline-block">'+
            '<span class="cr-mascot" style="font-size:64px;display:block;line-height:1.05;filter:drop-shadow(0 6px 10px rgba(0,0,0,'+(dark?'.4':'.12')+'))">'+mascot.e+'</span>'+

          '</div>'+
          '<div class="serif" style="font-size:14px;font-style:italic;color:'+p.txt+';opacity:.8;margin-top:2px">'+hello+'</div>'+

      (S.crRedecoConfirm?

    document.querySelectorAll('[data-crsec]').forEach(function(b){b.onclick=function(){S.crSection=parseInt(b.dataset.crsec);drawComfortScrapbook();};});

  /* ── SECTION VIEW ── */
  var page=S.crSection||0;
  var pgLabels=['Memories','Affirmations','Songs','Notes to Me','Voices'];
  var pgIcons=['&#128248;','&#128173;','&#127925;','&#9993;&#65039;','&#127908;'];

  var pages=[
    /* Page 0 — Memories */
    '<div style="padding:12px 8px 70px">'+(S.crPhotos.length?
      '<div style="display:flex;flex-wrap:wrap;justify-content:center">'+S.crPhotos.map(polaroid).join('')+'</div>':
      '<div class="serif" style="font-size:13px;font-style:italic;color:'+p.txt+';opacity:.45;text-align:center;padding:30px 20px 10px">The walls are bare for now. Add a photo of someone or somewhere that feels like home.</div>')+
      '<div style="margin-top:16px;border-top:1px dashed '+p.bdr+';padding-top:14px">'+
        '<button id="cr-addphoto" style="display:block;width:100%;padding:10px;background:none;border:1.5px dashed '+p.bdr+';border-radius:12px;font-size:13px;color:'+p.accent+';cursor:pointer;font-family:\'DM Sans\',sans-serif">+ Add photos or videos</button>'+
      '</div>'+
    '</div>',

    /* Page 1 — Affirmations */
    '<div style="padding:16px 12px 70px">'+
      (S.crAffirmations.length?S.crAffirmations.map(affCard).join(''):'<div class="serif" style="font-size:13px;font-style:italic;color:'+p.txt+';opacity:.45;text-align:center;padding:30px 20px 10px">Nothing pinned up yet. Write yourself something kind, or borrow one below.</div>')+
      '<div style="margin-top:8px;border-top:1px dashed '+p.bdr+';padding-top:14px">'+
        (S.crAffEditIdx!==-1&&S.crAffEditIdx!==undefined?
          '<div style="font-size:11px;font-weight:600;color:var(--acc);margin-bottom:4px">Changing this one</div>':'')+
        '<textarea id="cr-afftxt" rows="2" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid '+p.bdr+';border-radius:10px;font-size:14px;font-family:\'DM Serif Display\',serif;font-style:italic;background:'+p.card+';color:'+p.txt+';resize:none;margin-bottom:6px" placeholder="Something you need to hear…">'+esc(S.crAffText||'')+'</textarea>'+
        '<button id="cr-affsave" style="width:100%;padding:9px;margin-bottom:8px;background:'+p.accent+';color:#fff;border:none;border-radius:12px;font-size:13px;cursor:pointer;font-family:\'DM Sans\',sans-serif">Pin it up</button>'+
        '<div style="font-size:11px;color:'+p.txt+';opacity:.5;margin-bottom:6px;font-weight:500">Or borrow one of these:</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:6px">'+
          PRESET_AFFS.map(function(aff,pi){

          }).join('')+
        '</div>'+
      '</div>'+
    '</div>',

    /* Page 2 — Songs */
    '<div style="padding:14px 12px 70px">'+
      (S.crSongs.length?S.crSongs.map(songStub).join(''):'<div class="serif" style="font-size:13px;font-style:italic;color:'+p.txt+';opacity:.45;text-align:center;padding:30px 20px 10px">No songs yet. Add the one you play when you need to feel okay.</div>')+
      '<div style="margin-top:8px;border-top:1px dashed '+p.bdr+';padding-top:14px">'+
        '<input id="cr-sgname" style="width:100%;box-sizing:border-box;padding:9px 12px;border:1.5px solid '+p.bdr+';border-radius:10px;font-size:13px;background:'+p.card+';color:'+p.txt+';margin-bottom:6px;font-family:\'DM Sans\',sans-serif" placeholder="Song name — Artist" value="'+esc(S.crSongDraft&&S.crSongDraft.name||'')+'">'+

        '<button id="cr-sgsave" style="width:100%;padding:9px;background:'+p.accent+';color:#fff;border:none;border-radius:12px;font-size:13px;cursor:pointer;font-family:\'DM Sans\',sans-serif">Keep this song</button>'+

    '</div>',

    /* Page 3 — Notes to Future Me */
    '<div style="padding:14px 12px 70px">'+
      '<div style="background:rgba(0,0,0,.04);border-radius:12px;padding:12px 14px;margin-bottom:14px"><div style="font-size:13px;font-weight:500;color:'+p.txt+';margin-bottom:4px">Write to your future self</div><div style="font-size:12px;color:'+p.txt+';opacity:.65;line-height:1.5">Set a date and seal your note — it stays locked until that day arrives. A little kindness from past you, waiting at the right moment.</div></div>'+
      (S.crNotes.length?
        S.crNotes.map(function(n,i){var openD=new Date(n.openDate+'T00:00:00');return envelope(n,i,today>=openD);}).join(''):
        '<div class="serif" style="font-size:13px;font-style:italic;color:'+p.txt+';opacity:.45;text-align:center;padding:20px 20px 10px">No letters waiting yet. Write one for a day that might need it.</div>')+
      '<div style="margin-top:8px;border-top:1px dashed '+p.bdr+';padding-top:14px">'+
        '<textarea id="cr-notetxt" rows="3" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid '+p.bdr+';border-radius:10px;font-size:14px;font-family:\'DM Serif Display\',serif;font-style:italic;background:'+p.card+';color:'+p.txt+';resize:none;margin-bottom:6px" placeholder="Dear future me&#8230;">'+esc(S.crNoteText||'')+'</textarea>'+
        '<div style="display:flex;gap:8px;align-items:flex-end">'+
          '<div style="flex:1"><div style="font-size:10px;color:var(--t3);margin-bottom:3px">Open it on</div>'+
            '<input type="date" id="cr-notedate" min="'+todayStr+'" value="'+esc(S.crNoteDate||'')+'" style="width:100%;box-sizing:border-box;padding:9px 12px;border:1.5px solid '+p.bdr+';border-radius:10px;font-size:13px;background:'+p.card+';color:'+p.txt+';font-family:\'DM Sans\',sans-serif"></div>'+
          '<button id="cr-notesave" style="padding:9px 14px;background:'+p.accent+';color:#fff;border:none;border-radius:12px;font-size:13px;cursor:pointer;font-family:\'DM Sans\',sans-serif">Seal</button>'+
        '</div>'+
      '</div>'+
    '</div>',

    /* Page 4 — Voices */
    (function(){
      function voiceCard(v,i){
        var src=v.data||'';
        return '<div style="background:'+p.card+';border:1px solid '+p.bdr+';border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px">'+
          '<div style="width:40px;height:40px;border-radius:50%;background:'+p.accent+'26;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px">🎙</div>'+
          '<div style="flex:1;min-width:0">'+
            '<div style="font-size:13px;font-weight:600;color:'+p.txt+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(v.label)+'</div>'+
            (src?'<audio id="va-'+v.id+'" src="'+src+'" controls preload="metadata" style="width:100%;height:28px;margin-top:4px;accent-color:'+p.accent+'"></audio>':
              '<div style="font-size:11px;color:'+p.txt+';opacity:.75;margin-top:3px;line-height:1.45">This recording is no longer available. Delete and re-record, or upload an audio file instead.</div>')+
          '</div>'+
          '<button data-vcdel="'+i+'" aria-label="Delete '+esc(v.label)+'" style="background:none;border:none;cursor:pointer;color:var(--t3);font-size:18px;flex-shrink:0">&#215;</button>'+
        '</div>';
      }
      var vcList=S.crVoices&&S.crVoices.length?S.crVoices.map(voiceCard).join(''):'<div class="serif" style="font-size:13px;font-style:italic;color:'+p.txt+';opacity:.55;text-align:center;padding:30px 20px 10px;line-height:1.6">No voices here yet. Keep one that makes you feel safe — a friend, a parent, or your own.</div>';
      var msgHtml=voiceMsg?
        '<div style="display:flex;align-items:flex-start;gap:8px;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:12px;line-height:1.5;'+
          (voiceMsg.ok?'background:var(--gbg);border:1.5px solid var(--gbdr);color:var(--gt)':'background:var(--sos);border:1.5px solid var(--sosbdr);color:var(--sosh)')+'">'+
          '<span style="flex-shrink:0">'+(voiceMsg.ok?'✓':'!')+'</span><span>'+esc(voiceMsg.text)+'</span></div>':'';
      return '<div style="padding:14px 12px 70px">'+
        msgHtml+
        vcList+
        '<div style="margin-top:10px;border-top:1px dashed '+p.bdr+';padding-top:14px">'+
          '<div style="font-size:12px;font-weight:500;color:'+p.txt+';opacity:.75;margin-bottom:4px">Record a voice note</div>'+
          '<div style="font-size:11px;color:'+p.txt+';opacity:.6;margin-bottom:8px;line-height:1.45">Up to 1 minute. It stays on this device, so it\'ll still be here next time.</div>'+
          '<div style="display:flex;gap:8px;margin-bottom:10px">'+
            '<input id="vc-label" placeholder="Whose voice is this?" style="flex:1;min-width:0;padding:9px 12px;border:1.5px solid '+p.bdr+';border-radius:10px;font-size:13px;background:'+p.card+';color:'+p.txt+';font-family:\'DM Sans\',sans-serif"'+(voiceRecording?' disabled':'')+'>'+
            '<button id="vc-rec" style="padding:9px 14px;background:'+(voiceRecording?'var(--acc)':p.accent)+';color:#fff;border:none;border-radius:10px;font-size:13px;cursor:pointer;font-family:\'DM Sans\',sans-serif;white-space:nowrap">'+(voiceRecording?'⏹ Stop':'⏺ Record')+'</button>'+
          '</div>'+
          (voiceRecording?'<div id="vc-timer" style="font-size:12px;color:var(--acc);margin-bottom:10px;animation:pulse 1s infinite">● Recording… '+fmtVoiceSecs(Math.floor((Date.now()-voiceStart)/1000))+' / 1:00</div>':'')+
          '<div style="font-size:12px;font-weight:500;color:'+p.txt+';opacity:.75;margin-bottom:6px">Or upload an audio file</div>'+
          '<button id="vc-upload" style="display:block;width:100%;padding:9px;background:none;border:1.5px dashed '+p.bdr+';border-radius:12px;font-size:13px;color:'+p.accent+';cursor:pointer;font-family:\'DM Sans\',sans-serif">+ Upload a voice note (up to 3 MB)</button>'+
        '</div>'+
      '</div>';
    })()
  ];

  shell(
    '<button class="bk" id="mcbk"><i class="ti ti-arrow-left" style="font-size:18px"></i>Back</button>'+
    '<span style="font-size:16px;margin:0 auto">'+pgIcons[page]+' '+pgLabels[page]+'</span>',
    '<div style="height:100%;overflow-y:auto;background:'+p.bg+'" class="cr-grain">'+pages[page]+'</div>',
    true, true);

  var sh=document.querySelector('.shell');if(sh)sh.style.background=p.bg;
  var crtb=document.querySelector('.shell .tb');if(crtb)crtb.style.background=p.bg;
  var crbk=Q('mcbk');if(crbk){crbk.style.setProperty('color',p.txt,'important');var cri=crbk.querySelector('i');if(cri)cri.style.setProperty('color',p.txt,'important');}
  var crtit=crtb&&crtb.querySelector('span');if(crtit)crtit.style.color=p.txt;
  Q('mcbk').onclick=function(){if(sh)sh.style.background='';if(crtb)crtb.style.background='';S.crSection=null;S.crRedecoConfirm=false;voiceMsg=null;drawComfortScrapbook();};

  var addPh=Q('cr-addphoto');
  if(addPh)addPh.onclick=function(){
    var fi=document.createElement('input');fi.type='file';fi.accept='image/*,image/heic,image/heif,video/*';fi.multiple=true;
    fi.style.cssText='position:fixed;top:-200px;left:-200px;opacity:0;pointer-events:none';
    document.body.appendChild(fi);
    fi.onchange=function(e){
      document.body.removeChild(fi);
      var files=Array.from(e.target.files);if(!files.length)return;
      var processed=0,total=files.length;
      files.forEach(function(file,fi2){
        if(file.type.startsWith('video/')){
          var vid=document.createElement('video');
          vid.preload='auto';
          var objUrl=URL.createObjectURL(file);
          vid.src=objUrl;
          var vidId=Date.now()+fi2;
          var thumbDone=false;
          function captureThumb(){
            if(thumbDone)return;thumbDone=true;
            var thumbUrl='';
            try{
              var vw=vid.videoWidth||320,vh=vid.videoHeight||240;
              var cvs=document.createElement('canvas');
              cvs.width=Math.min(300,vw);cvs.height=Math.round(cvs.width*vh/Math.max(vw,1));
              cvs.getContext('2d').drawImage(vid,0,0,cvs.width,cvs.height);
              thumbUrl=cvs.toDataURL('image/jpeg',.72);
            }catch(e){}
            videoCache[vidId]=objUrl;
            S.crPhotos.unshift({id:vidId,url:thumbUrl,isVideo:true});
            processed++;saveS();
            if(processed===total){S.crSection=0;drawComfortScrapbook();}
          }
          vid.onloadeddata=function(){setTimeout(captureThumb,400);};
          vid.onseeked=function(){setTimeout(captureThumb,100);};
          vid.onerror=function(){if(!thumbDone){thumbDone=true;S.crPhotos.unshift({id:vidId,url:'',isVideo:true});URL.revokeObjectURL(objUrl);processed++;saveS();if(processed===total){S.crSection=0;drawComfortScrapbook();}}};
          vid.currentTime=0;
          vid.load();
        } else {
          var reader=new FileReader();
          reader.onload=function(ev){
            var rawUrl=ev.target.result;
            var img=new Image();
            img.onload=function(){
              try{
                var cvs=document.createElement('canvas');
                var maxW=600,maxH=600,ratio=Math.min(maxW/img.width,maxH/img.height,1);
                cvs.width=Math.round(img.width*ratio);cvs.height=Math.round(img.height*ratio);
                cvs.getContext('2d').drawImage(img,0,0,cvs.width,cvs.height);
                S.crPhotos.unshift({id:Date.now()+fi2,url:cvs.toDataURL('image/jpeg',.72)});
              }catch(e){
                S.crPhotos.unshift({id:Date.now()+fi2,url:rawUrl});
              }
              processed++;saveS();
              if(processed===total){S.crSection=0;drawComfortScrapbook();}
            };
            img.onerror=function(){
              S.crPhotos.unshift({id:Date.now()+fi2,url:rawUrl});
              processed++;saveS();
              if(processed===total){S.crSection=0;drawComfortScrapbook();}
            };
            img.src=rawUrl;
          };reader.readAsDataURL(file);
        }
      });
    };fi.click();
  };

  document.querySelectorAll('[data-phview]').forEach(function(d){d.onclick=function(){
    var idx=parseInt(d.dataset.phview),ph=S.crPhotos[idx];if(!ph)return;
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column';
    var vidSrc=ph.isVideo&&videoCache[ph.id];
    var mediaHtml=vidSrc
      ?'<video src="'+vidSrc+'" controls style="max-width:95%;max-height:72vh;border-radius:8px"></video>'
      :(ph.url?'<img src="'+ph.url+'" style="max-width:95%;max-height:75vh;border-radius:8px">':'<div style="color:#fff;font-size:13px;padding:20px;text-align:center;opacity:.7">Video not available — delete and re-upload to watch again.</div>');
    ov.innerHTML=mediaHtml+
      '<div style="display:flex;gap:12px;margin-top:16px">'+
        '<button id="ph-close" style="padding:10px 20px;background:rgba(255,255,255,.15);border:none;border-radius:10px;color:#fff;font-size:14px;cursor:pointer;font-family:\'DM Sans\',sans-serif">Close</button>'+
        '<button id="ph-del" style="padding:10px 20px;background:rgba(200,50,50,.85);border:none;border-radius:10px;color:#fff;font-size:14px;cursor:pointer;font-family:\'DM Sans\',sans-serif">Delete '+(ph.isVideo?'video':'photo')+'</button>'+
      '</div>';
    document.body.appendChild(ov);
    ov.addEventListener('click',function(e){if(e.target===ov)document.body.removeChild(ov);});
    ov.querySelector('#ph-close').addEventListener('click',function(){document.body.removeChild(ov);});
    ov.querySelector('#ph-del').addEventListener('click',function(){S.crPhotos.splice(idx,1);saveS();document.body.removeChild(ov);S.crSection=0;drawComfortScrapbook();});
  };});

  if(S.crAffEditIdx===undefined)S.crAffEditIdx=-1;
  var afftxt=Q('cr-afftxt');if(afftxt){afftxt.value=S.crAffText||'';afftxt.oninput=function(){S.crAffText=afftxt.value;};}
  var affsave=Q('cr-affsave');
  if(affsave)affsave.onclick=function(){
    var ta=Q('cr-afftxt');var txt=(ta?ta.value.trim():'')||S.crAffText.trim();if(!txt)return;
    if(S.crAffEditIdx>=0){S.crAffirmations[S.crAffEditIdx]={id:S.crAffirmations[S.crAffEditIdx].id,text:txt};S.crAffEditIdx=-1;}
    else{S.crAffirmations.unshift({id:Date.now(),text:txt});}
    S.crAffText='';saveS();S.crSection=1;drawComfortScrapbook();
  };
  document.querySelectorAll('[data-preset]').forEach(function(b){b.onclick=function(){
    var txt=PRESET_AFFS[parseInt(b.dataset.preset)];
    S.crAffText=txt;var ta=Q('cr-afftxt');if(ta)ta.value=txt;
  };});
  document.querySelectorAll('[data-affedit]').forEach(function(b){b.onclick=function(){
    var i=parseInt(b.dataset.affedit);S.crAffEditIdx=i;S.crAffText=S.crAffirmations[i].text;S.crSection=1;drawComfortScrapbook();
  };});
  document.querySelectorAll('[data-affdel]').forEach(function(b){b.onclick=function(){S.crAffirmations.splice(parseInt(b.dataset.affdel),1);saveS();S.crSection=1;drawComfortScrapbook();};});

  var sgn=Q('cr-sgname'),sgu=Q('cr-sgurl');
  if(sgn)sgn.oninput=function(){S.crSongDraft=S.crSongDraft||{};S.crSongDraft.name=sgn.value;};
  if(sgu)sgu.oninput=function(){S.crSongDraft=S.crSongDraft||{};S.crSongDraft.url=sgu.value;};
  var sgsave=Q('cr-sgsave');
  if(sgsave)sgsave.onclick=function(){
    var nm=(sgn?sgn.value.trim():'')|| (S.crSongDraft&&S.crSongDraft.name||'').trim();
    var ur=(sgu?sgu.value.trim():'')|| (S.crSongDraft&&S.crSongDraft.url||'').trim();
    if(!nm||!ur)return;
    S.crSongs.unshift({id:Date.now(),name:nm,url:ur});S.crSongDraft={name:'',url:''};saveS();S.crSection=2;drawComfortScrapbook();
  };
  document.querySelectorAll('[data-sgdel]').forEach(function(b){b.onclick=function(e){e.preventDefault();e.stopPropagation();S.crSongs.splice(parseInt(b.dataset.sgdel),1);saveS();S.crSection=2;drawComfortScrapbook();};});

  var notetxt=Q('cr-notetxt'),notedate=Q('cr-notedate');
  if(notetxt)notetxt.oninput=function(){S.crNoteText=notetxt.value;};
  if(notedate)notedate.oninput=function(){S.crNoteDate=notedate.value;};
  var notesave=Q('cr-notesave');
  if(notesave)notesave.onclick=function(){
    var txt=(notetxt?notetxt.value.trim():'')||S.crNoteText.trim();
    var dt=(notedate?notedate.value:'')||S.crNoteDate;
    if(!txt||!dt)return;
    S.crNotes.unshift({id:Date.now(),text:txt,openDate:dt});S.crNoteText='';S.crNoteDate='';saveS();S.crSection=3;drawComfortScrapbook();
  };
  document.querySelectorAll('[data-notedel]').forEach(function(b){b.onclick=function(){S.crNotes.splice(parseInt(b.dataset.notedel),1);saveS();S.crSection=3;drawComfortScrapbook();};});

  /* ── Voices bindings ── */
  /* Voices are stored as base64 data URLs inside the saved state so they survive a reload.
     Before saving we check the size and that the write really succeeded; if not, the entry is
     rolled back and a clear message is shown — never a silent, unplayable entry. */
  function showVoiceMsg(ok,text){voiceMsg={ok:ok,text:text};if((S.scr==='mycorner'||S.scr==='comfort')&&S.myCornerTab==='comfort'&&S.crSection===4)drawComfortScrapbook();}
  function persistVoice(dataUrl,label){
    if(!S.crVoices)S.crVoices=[];
    var entry={id:Date.now(),label:label||'Voice note',data:dataUrl};
    S.crVoices.unshift(entry);
    var json;try{json=aoSerialize();}catch(e){json=null;}
    var ok=false;
    if(json&&json.length<=AO_STORE_LIMIT){try{localStorage.setItem('ao_s',json);ok=true;}catch(e){ok=false;}}
    if(!ok){
      S.crVoices.shift();
      showVoiceMsg(false,'There isn\'t enough room on this device to keep that recording. Try a shorter one, or delete an older voice or photo to make space.');
      return;
    }
    showVoiceMsg(true,'Saved “'+entry.label+'”. It\'ll be here whenever you need it.');
  }
  function saveVoice(blob,label){
    var reader=new FileReader();
    reader.onload=function(){persistVoice(reader.result,label);};
    reader.onerror=function(){showVoiceMsg(false,'That recording couldn\'t be read, so it wasn\'t saved. Please try again.');};
    reader.readAsDataURL(blob);
  }
  var vcRec=Q('vc-rec');
  if(vcRec)vcRec.onclick=function(){
    if(voiceRecording){
      if(voiceRecorder&&voiceRecorder.state!=='inactive')voiceRecorder.stop();
      return;
    }
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){
      showVoiceMsg(false,'Recording isn\'t available in this browser. You can upload an audio file instead.');return;
    }
    var lbl=(Q('vc-label')?Q('vc-label').value.trim():'')||'Voice note';
    voiceMsg=null;
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      voiceChunks=[];voiceRecording=true;voiceStart=Date.now();
      voiceRecorder=new MediaRecorder(stream);
      voiceRecorder.ondataavailable=function(e){if(e.data.size>0)voiceChunks.push(e.data);};
      voiceRecorder.onstop=function(){
        voiceRecording=false;
        if(voiceTimer){clearTimeout(voiceTimer);voiceTimer=null;}
        if(voiceTick){clearInterval(voiceTick);voiceTick=null;}
        stream.getTracks().forEach(function(t){t.stop();});
        var blob=new Blob(voiceChunks,{type:voiceRecorder.mimeType||'audio/webm'});
        if(!blob.size){showVoiceMsg(false,'Nothing was recorded. Please try again.');return;}
        saveVoice(blob,lbl);
      };
      voiceRecorder.start();
      /* Hard cap at 60 seconds */
      voiceTimer=setTimeout(function(){if(voiceRecorder&&voiceRecorder.state!=='inactive')voiceRecorder.stop();},VOICE_MAX_SEC*1000);
      voiceTick=setInterval(function(){var el=Q('vc-timer');if(el)el.textContent='● Recording… '+fmtVoiceSecs(Math.min(VOICE_MAX_SEC,Math.floor((Date.now()-voiceStart)/1000)))+' / 1:00';},500);
      S.crSection=4;drawComfortScrapbook();
    }).catch(function(){voiceRecording=false;showVoiceMsg(false,'I couldn\'t reach your microphone. Check that this page is allowed to use it, or upload an audio file instead.');});
  };
  var vcUp=Q('vc-upload');
  if(vcUp)vcUp.onclick=function(){
    var fi=document.createElement('input');fi.type='file';fi.accept='audio/*';
    fi.style.cssText='position:fixed;top:-200px;left:-200px;opacity:0;pointer-events:none';
    document.body.appendChild(fi);
    fi.onchange=function(e){
      document.body.removeChild(fi);
      var file=e.target.files[0];if(!file)return;
      if(file.size>VOICE_MAX_UPLOAD){showVoiceMsg(false,'That file is too big to keep here — the limit is 3 MB. A clip of a minute or two usually fits.');return;}
      var lbl=(Q('vc-label')?Q('vc-label').value.trim():'')||file.name.replace(/\.[^.]+$/,'');
      saveVoice(file,lbl);
    };
    fi.click();
  };
  document.querySelectorAll('[data-vcdel]').forEach(function(b){b.onclick=function(){
    var i=parseInt(b.dataset.vcdel);
    voiceMsg=null;
    S.crVoices.splice(i,1);saveS();S.crSection=4;drawComfortScrapbook();
  };});
}

/* ── ROUTER ── */
function draw(){
  if(!S.ob){drawOb();return;}
  if(!S.name&&S.obPath==='stressed'&&S.scr!=='support'){S.scr='support';}
  if(!S.name&&S.obPath==='overwhelmed'&&S.scr!=='mood'){S.scr='mood';}
  var screens={mood:drawMood,calm:drawCalm,support:drawSupport,mycorner:drawMyCorner,wins:function(){S.myCornerTab='wins';drawMyCorner();},me:drawMe,wcs:drawWCS,'game-doodle':initDoodle,'game-ball':initBall,'game-bubble':initBubble,'game-stars':initStars,'game-firefly':initFirefly,'game-colorfill':initColorFill,'game-sand':initSand,'game-stonestack':initStoneStack,'game-breathbubble':initBreathBubble,comfort:function(){S.myCornerTab='comfort';drawMyCorner();},venthistory:drawVentHistory,doodlegallery:drawDoodleGallery};
  var fn=screens[S.scr];if(fn)fn();else{S.scr='mood';drawMood();}
}
loadS();draw();checkDailyNotif();setInterval(checkDailyNotif,60000);
</script>
</body>
