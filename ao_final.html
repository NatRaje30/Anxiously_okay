<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#c8d8c8;display:flex;justify-content:center;padding:10px;min-height:100vh}
#root{width:360px}
.shell{width:360px;height:620px;border-radius:24px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.18);display:flex;flex-direction:column;position:relative;--bg:#fff;--bg2:#f5f9f7;--text:#1a2e24;--t2:#6b8070;--t3:#9aafa6;--bdr:#e2e8e4;--bdr2:#dce8e2;--gbg:#EAF3DE;--gt:#27500A;--gbdr:#C0DD97;--sos-bg:#FAECE7;--sos-t:#993C1D;--sos-h:#4A1B0C;--mic-bg:#FAECE7;--mic-bdr:#F5C4B3;--sound-bg:#1a0d35;--mem-bg:rgba(255,248,240,.7);--mem-bdr:rgba(255,190,140,.5);--mem-date:#c0906a;--mem-text:#3d1c08;background:var(--bg);font-family:'DM Sans',sans-serif}
.shell.dark{--bg:#0d1a10;--bg2:#142014;--text:#cce8d4;--t2:#b8d8c0;--t3:#8ab898;--bdr:#2a3a2e;--bdr2:#1e2a20;--gbg:#102010;--gt:#70e890;--gbdr:#2a4a2e;--sos-bg:#3a1008;--sos-t:#f08868;--sos-h:#ffcca8;--mic-bg:#3a1008;--mic-bdr:#602018;--sound-bg:#0d0820;--mem-bg:rgba(30,15,8,.9);--mem-bdr:rgba(80,45,15,.7);--mem-date:#b08060;--mem-text:#c09878}
.shell.dark .bk,.shell.dark .bk *,.shell.dark .tbt{color:var(--t2)!important}
.shell.dark .stab:not(.on){color:var(--text)!important;background:rgba(255,255,255,.07)!important;border-color:var(--bdr)!important}
.shell.dark .stab.on{color:#1D9E75!important;background:var(--gbg)!important;border-color:var(--gbdr)!important}
.shell.dark .tg:not(.on){color:var(--t2)!important;background:rgba(255,255,255,.04)!important}
.shell.dark .tg.on{color:#1D9E75!important;background:var(--gbg)!important}
.shell.dark .ni:not(.on),.shell.dark .ni:not(.on) i{color:var(--t2)!important}
.shell.dark .ni.on,.shell.dark .ni.on i{color:#1D9E75!important}
.shell.dark .tb,.shell.dark .nav{background:var(--bg)!important;border-color:var(--bdr)!important}
.sup-n{background:#D85A30!important;border-radius:50%;width:52px;height:52px;flex:0 0 52px;align-self:center;margin:0 6px;padding:0;box-shadow:0 2px 14px rgba(216,90,48,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500}
.sup-n,.sup-n *{color:#fff!important}
.serif{font-family:'DM Serif Display',serif;font-weight:400}
.scroll{flex:1;overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.gb{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.tb{display:flex;align-items:center;padding:13px 14px 8px;min-height:48px;position:relative;flex-shrink:0;background:var(--bg);gap:4px}
.tbt{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:500;color:var(--t2);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
.bk{background:none;border:none;cursor:pointer;color:var(--t2);font-size:13px;display:flex;align-items:center;gap:3px;z-index:1;flex-shrink:0;font-family:'DM Sans',sans-serif}
.dm{background:none;border:none;cursor:pointer;font-size:17px;padding:2px;flex-shrink:0;line-height:1;margin-left:auto}
.inp{width:100%;border:1px solid var(--bdr2);border-radius:10px;padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg2);outline:none}
.inp:focus{border-color:#1D9E75}
.ta{width:100%;border:1px solid var(--bdr2);border-radius:10px;padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg2);resize:none;outline:none}
.inp::placeholder,.ta::placeholder{color:var(--t3)}
.btn{width:100%;padding:13px;background:#1D9E75!important;color:#E1F5EE!important;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer}
.btn:disabled{background:#2a4030!important;color:#4a6050!important;cursor:not-allowed}
.shell.dark .btn:disabled{background:rgba(29,158,117,.18)!important;color:rgba(200,240,215,.45)!important;border:1px solid rgba(29,158,117,.3)!important}
.btng{width:100%;padding:13px;background:var(--bg2);color:var(--text);border:1px solid var(--bdr);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer}
.mb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border:1.5px solid var(--bdr);border-radius:12px;background:var(--bg);cursor:pointer;position:relative}
.mb.sel{border-color:var(--gbdr);background:var(--gbg)}
.stat{flex:1;background:var(--bg2);border-radius:10px;padding:10px;text-align:center}
.nav{flex-shrink:0;height:64px;background:var(--bg);border-top:.5px solid var(--bdr);display:flex;align-items:center;z-index:50}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;color:var(--t3);cursor:pointer;padding:6px 0 4px;position:relative;min-width:0}
.ni.on{color:#1D9E75}
.ni i{font-size:20px}
.pip{position:absolute;top:1px;left:50%;transform:translateX(-50%);width:5px;height:5px;background:#1D9E75;border-radius:50%}
.pip.d{border-radius:1px;transform:translateX(-50%) rotate(45deg)}
.pip.l{width:14px;height:3px;border-radius:2px;top:2px}
.pip.tr{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid #1D9E75;background:none;border-radius:0;top:0}
.binner{width:110px;height:110px;border-radius:50%;background:var(--sos-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tg{padding:5px 13px;border-radius:20px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--bdr);background:var(--bg);color:var(--t2)}
.tg.on{border-color:#1D9E75;background:var(--gbg);color:#1D9E75}
.trick{border:1.5px solid var(--bdr);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.trick.sel{border-color:#1D9E75;background:var(--gbg)}
.trick.full{opacity:.35;cursor:not-allowed}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:99}
.mbox{background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-height:85%;overflow-y:auto}
.ob{flex:1;overflow-y:auto;padding:32px 24px;display:flex;flex-direction:column;justify-content:center}
.bnr{display:flex;align-items:center;gap:8px;background:var(--gbg);border:1px solid var(--gbdr);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:var(--gt)}
.mic{width:38px;height:38px;border-radius:50%;background:var(--mic-bg);border:1.5px solid var(--mic-bdr);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.mic.on{background:#D85A30;border-color:#D85A30}
.vcard{background:var(--bg);border:1px solid var(--bdr);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:8px;text-decoration:none;cursor:pointer}
.gcard{border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;border:1px solid rgba(128,128,128,.08)}
.stab{padding:7px 14px;border-radius:20px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--bdr);background:var(--bg);color:var(--t2)}
.stab.on{border-color:#1D9E75;background:var(--gbg);color:#1D9E75}
.jent{background:var(--bg2);border-radius:10px;padding:11px 13px;margin-bottom:9px}
.pfield{padding:10px 0;border-bottom:.5px solid var(--bdr)}
.pfield .pl{font-size:11px;font-weight:500;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.pfield .pv{font-size:15px;color:var(--text);font-weight:500}
.cr-word{border-radius:12px;padding:13px 15px;margin-bottom:10px;display:flex;align-items:flex-start;gap:10px;border-left:4px solid #9FE1CB;background:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cr-mem{border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--mem-bdr);background:var(--mem-bg)}
canvas{display:block;touch-action:none}
.sel-inp{padding:7px 10px;border:1px solid var(--bdr);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:var(--bg2);outline:none;cursor:pointer}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<script>
'use strict';
var dark=false;
var EM=['','🌪️','🌥️','⛅️','🌤️','☀️'],MN=['','Stormy','Heavy','Steady','Lifted','Radiant'];
var TC={breathe:{bg:'#E8F4FD',c:'#1a6b9e'},meditate:{bg:'#F3EAF8',c:'#7b3fa0'},yoga:{bg:'#EAF3DE',c:'#3B6D11'}};
var PH=[{l:'inhale',i:'Breathe in slowly through your nose',d:4,s:1.0},{l:'hold',i:'Hold gently…',d:4,s:1.0},{l:'exhale',i:'Breathe out slowly through your mouth',d:4,s:.42},{l:'hold',i:'Hold gently…',d:4,s:.42}];
var VIDS=[{t:'Box Breathing',dur:'5:00',e:'💨',c:'#E8F4FD',tag:'breathe',yt:'tEmt1Znux58'},{t:'4-7-8 Breathing',dur:'6:30',e:'🌿',c:'#EAF3DE',tag:'breathe',yt:'YRPh_GaiL8s'},{t:'Ocean Wave Relaxation',dur:'10:00',e:'🌊',c:'#E8F4FD',tag:'breathe',yt:'RKVR1HxB0vc'},{t:'Morning Meditation',dur:'5:00',e:'🌅',c:'#FDF4E7',tag:'meditate',yt:'inpg1zBFa5Q'},{t:'Gentle Yoga',dur:'20:00',e:'🧘',c:'#EAF3DE',tag:'yoga',yt:'v7AYKMP6rOE'},{t:'Body Scan',dur:'12:00',e:'✨',c:'#F3EAF8',tag:'meditate',yt:'T0nuKFCHFkQ'},{t:'Sleep Meditation',dur:'15:00',e:'🌙',c:'#F3EAF8',tag:'meditate',yt:'aEqlQvczMJQ'},{t:'Yin Yoga for Calm',dur:'25:00',e:'🕯',c:'#E8F4FD',tag:'yoga',yt:'pE-0BwMpEAo'},{t:'Loving Kindness',dur:'10:00',e:'💚',c:'#EAF3DE',tag:'meditate',yt:'sz6GY5WjFcs'}];
var TRICKS=[{id:'ground',e:'👁',t:'5-4-3-2-1 Grounding',d:'Name 5 things you see, 4 you touch, 3 you hear, 2 you smell, 1 you taste.'},{id:'candy',e:'🍬',t:'Sour Candy',d:'The sharp taste jolts your nervous system back to the present.'},{id:'cold',e:'💧',t:'Cold Water on Wrists',d:'Run cold water over your wrists. Activates your dive reflex and slows your heart rate.'},{id:'butter',e:'🦋',t:'Butterfly Hug',d:'Cross arms over chest, tap alternate shoulders. Bilateral stimulation calms the amygdala.'},{id:'count',e:'🔢',t:'Count Back by 7s',d:'Start at 100, subtract 7 each time. Forces your brain from panic into logic.'},{id:'muscle',e:'💪',t:'Progressive Muscle Relax',d:'Tense each muscle group 5 seconds then release. Work from feet up to face.'},{id:'smell',e:'🌸',t:'Smell Something Strong',d:'Lavender, peppermint, citrus — grounds you fast via the olfactory-limbic connection.'},{id:'safe',e:'🏡',t:'Safe Place Visualisation',d:'Close your eyes and picture a place where you feel completely safe.'},{id:'hum',e:'🎵',t:'Hum or Sing',d:'Humming activates your vagus nerve, switching from fight-or-flight to rest-and-digest.'},{id:'333',e:'✨',t:'3-3-3 Rule',d:'Name 3 things you see, 3 sounds you hear, then move 3 parts of your body.'}];
var GAMES=[{id:'doodle',t:'Doodle Canvas',d:'Draw freely, no rules.',e:'🖊️',bg:'#EAF3DE'},{id:'ball',t:'Bouncing Ball',d:'Swipe anywhere to launch.',e:'🏀',bg:'#E8F4FD'},{id:'bubble',t:'Bubble Pop',d:'Pop every bubble you see.',e:'🫧',bg:'#F3EAF8'},{id:'stars',t:'Connect the Stars',d:'Draw your own constellation.',e:'⭐',bg:'#1a1a3e'},{id:'sand',t:'Zen Sand Garden',d:'Rake your own patterns.',e:'🪨',bg:'#FDF4E7'},{id:'firefly',t:'Firefly Garden',d:'Tap to summon fireflies.',e:'✨',bg:'#0a2010'}];
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function mkS(){return{ob:false,name:'',dob:'',scr:'mood',mood:null,moodDone:false,moodHist:[3,2,4,3,5,4,null],streak:7,entries:24,dump:'',micOn:false,ventDone:false,calmTab:'comfort',libTag:'all',cWords:['I am doing the best I can','This feeling will pass','I am enough'],cSounds:[{t:'Weightless — Marconi Union',u:'https://www.youtube.com/watch?v=UfcAVejslrU'},{t:'Clair de Lune — Debussy',u:'https://www.youtube.com/watch?v=CvFH_6DNRCY'}],cMems:[{t:'The afternoon I sat in the park and everything felt okay.',d:'A memory',img:null}],cTab:'words',cNewW:'',cNewSUrl:'',cNewM:'',cNewImg:null,supTab:'sos',jv:['','',''],jlog:[{date:'Yesterday',ts:Date.now()-86400000,items:["Sent a difficult email I'd been avoiding","Made myself a proper meal","Got some fresh air"]},{date:'2 days ago',ts:Date.now()-172800000,items:["Got out of bed on time","Reached out to a friend","Finished reading a chapter"]}],jSort:'newest',jMonth:'all',breatheOn:false,trickModal:false,tricks:['ground','candy','cold'],profEdit:false,pName:'',pDob:'',confirmDelete:false};}
var S=mkS(),bRAF=null,bPS=null,bPI=0,gLoop=null,recog=null;
function toggleDark(){dark=!dark;draw();}
function greet(){var h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}
function fmtDob(d){if(!d)return'—';var p=d.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});}
function calcAge(d){if(!d)return null;var p=d.split('-').map(Number),b=new Date(p[0],p[1]-1,p[2]),n=new Date(),a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a;}
function dStr(){return new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}
function wavg(){var v=S.moodHist.filter(function(x){return x!==null;});return v.length?(v.reduce(function(a,b){return a+b;},0)/v.length).toFixed(1):'—';}
function eio(t){return t<.5?2*t*t:-1+(4-2*t)*t;}
function getPos(e,c){var r=c.getBoundingClientRect(),sx=c.width/r.width,sy=c.height/r.height;var s=e.touches&&e.touches.length?e.touches[0]:e.changedTouches&&e.changedTouches.length?e.changedTouches[0]:e;return{x:(s.clientX-r.left)*sx,y:(s.clientY-r.top)*sy};}
function stopB(){S.breatheOn=false;if(bRAF){cancelAnimationFrame(bRAF);bRAF=null;}bPS=null;bPI=0;['bi','bl','bc','binstr','bbtn'].forEach(function(id){var e=document.getElementById(id);if(!e)return;if(id==='bi'){e.style.transition='transform .6s ease';e.style.transform='scale(1)';setTimeout(function(){if(e)e.style.transition='none';},700);}if(id==='bl')e.textContent='ready';if(id==='bc')e.textContent='—';if(id==='binstr')e.textContent='Box breathing — 4 counts each phase';if(id==='bbtn')e.textContent='Start breathing';});}
function bFrame(ts){if(!S.breatheOn)return;if(bPS===null)bPS=ts;var ph=PH[bPI],pv=PH[(bPI+3)%4],el=(ts-bPS)/1000,pr=Math.min(el/ph.d,1),sc=pv.s+(ph.s-pv.s)*eio(pr);var inn=document.getElementById('bi');if(inn)inn.style.transform='scale('+sc+')';var bc=document.getElementById('bc'),bl=document.getElementById('bl');if(bc)bc.textContent=Math.max(Math.ceil(ph.d-el),1);if(bl)bl.textContent=ph.l;if(pr>=1){bPI=(bPI+1)%4;bPS=ts;var bi=document.getElementById('binstr');if(bi)bi.textContent=PH[bPI].i;}bRAF=requestAnimationFrame(bFrame);}
function startB(){S.breatheOn=true;bPI=0;bPS=null;var inn=document.getElementById('bi');if(inn){inn.style.transition='none';inn.style.transform='scale(.42)';}var bi=document.getElementById('binstr'),bb=document.getElementById('bbtn');if(bi)bi.textContent=PH[0].i;if(bb)bb.textContent='Stop';bRAF=requestAnimationFrame(bFrame);}
function stopGame(){if(gLoop){cancelAnimationFrame(gLoop);gLoop=null;}}
function go(s){if(s!=='support')stopB();stopGame();S.scr=s;S.trickModal=false;draw();}
function logout(){stopB();stopGame();S=mkS();draw();}
function toggleMic(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Speech recognition needs Chrome or Safari.');return;}if(S.micOn){if(recog)recog.stop();S.micOn=false;draw();return;}recog=new SR();recog.continuous=false;recog.interimResults=false;recog.lang='en-US';recog.onresult=function(e){S.dump=(S.dump?S.dump+' ':'')+e.results[0][0].transcript;S.micOn=false;draw();};recog.onerror=recog.onend=function(){S.micOn=false;draw();};S.micOn=true;recog.start();draw();}
function NAV(){var tabs=[{id:'mood',ic:'ti-sun',lb:'mood',pip:''},{id:'calm',ic:'ti-leaf',lb:'calm',pip:'d'},null,{id:'wins',ic:'ti-trophy',lb:'wins',pip:'l'},{id:'me',ic:'ti-user-circle',lb:'me',pip:'tr'}];var h='<div class="nav">';tabs.forEach(function(t){if(!t){h+='<button class="sup-n" id="n-sup"><i class="ti ti-heart-handshake" style="font-size:19px"></i><span>support</span></button>';}else{var on=S.scr===t.id||(t.id==='wins'&&S.scr==='jall');h+='<button class="ni'+(on?' on':'')+'" id="n-'+t.id+'">'+(on?'<span class="pip '+t.pip+'"></span>':'')+'<i class="ti '+t.ic+'"></i>'+t.lb+'</button>';}});return h+'</div>';}
